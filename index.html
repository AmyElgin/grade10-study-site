<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Schoolie – Exam Prep</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f6fb;color:#1f2937}
nav{position:fixed;top:0;left:0;bottom:0;width:230px;background:#1e3a8a;color:#fff;padding:20px;overflow:auto}nav h1{font-size:20px;margin:0 0 12px}nav a{display:block;padding:8px 10px;border-radius:8px;color:#dbeafe;text-decoration:none}nav a.on{background:#3b82f6;color:#fff}
main{margin-left:230px;padding:24px 32px 60px}h2{margin:0}.sub{color:#6b7280;margin-bottom:16px}h3{border-bottom:2px solid #c7d2fe;padding-bottom:4px;margin-top:28px;scroll-margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0001}
.yr{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}.card b{display:block;margin:8px 0}
.row{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}.row span{font-size:12px;color:#6b7280;width:44px}
.btns a{display:inline-block;font-size:13px;padding:6px 10px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none}.btns a.m{background:#059669}.btns a.d{background:#e5e7eb;color:#111}.btns a.w{background:#dbeafe;color:#1e40af}
.note{background:#fef3c7;padding:6px 8px;border-radius:6px}
#v{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}#v>div{background:#fff;width:92vw;height:92vh;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}#v iframe,#v img{flex:1;border:0;width:100%;min-height:0;object-fit:contain}
#vb{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #e5e7eb}#vb b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#vb a,#vb button{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:0;background:#e5e7eb;color:#111;text-decoration:none;cursor:pointer}
@media(max-width:760px){nav{position:static;width:auto;padding:12px}nav #s{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap}main{margin-left:0;padding:16px}#v>div{width:100vw;height:100vh;border-radius:0}}
</style></head><body><nav><h1>📚 Schoolie</h1><div id=s></div></nav><main id=c></main>
<div id=v><div><div id=vb><button onclick=closeV()>← Back</button><b id=vt></b><a id=vd download>⬇ Download</a><a id=vo target=_blank rel=noopener>Open ↗</a></div><iframe id=vf title=Viewer></iframe><img id=vi alt=""></div></div>
<script src="manifest.js"></script>
<script>
const M=window.MANIFEST,slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const u=p=>encodeURI(p),fname=p=>p.split('/').pop();
if('scrollRestoration' in history)history.scrollRestoration='manual';
let cur=null;
function parse(){const h=new URLSearchParams(location.hash.slice(1));return{s:h.get('s')||'',sec:h.get('sec')||'',v:h.get('v')||''}}
function link(o){const h=new URLSearchParams();for(const k of['s','sec','v'])if(o[k])h.set(k,o[k]);return '#'+h}
function subj(id){return M.subjects.find(S=>slug(S.name)==id)}
function dl(f,lab){const p=f.local;let h=`<a class=d href="${esc(u(p))}" download="${esc(fname(p))}">⬇ ${lab}${f.orig?' PDF':''}</a>`;
 if(f.orig){const e=f.orig.split('.').pop().toLowerCase();h+=`<a class=w href="${esc(u(f.orig))}" download="${esc(fname(f.orig))}">⬇ ${e.startsWith('ppt')?'PowerPoint':e.startsWith('xls')?'Excel':'Word'}</a>`}return h}
function row(S,ti,ii,x,k){const f=x[k];if(!f)return'';const lab=k=='paper'?'Paper':'Memo';
 return `<div class="row btns"><span>${lab}</span><a class=${k=='memo'?'m':''} href="${link({s:slug(S.name),sec:slug(S.topics[ti].name),v:ti+'.'+ii+'.'+k})}">View</a>${dl(f,'Download')}</div>`}
function renderSubject(S){c.innerHTML=`<h2>${esc(S.name)}</h2><div class=sub>${esc(S.class)}${S.teacher?' · '+esc(S.teacher):''}</div>`+S.topics.map((T,ti)=>`<h3 id="sec-${slug(T.name)}">${esc(T.name)}</h3><div class=grid>${T.items.length?'':'<i style="color:#888">Not available yet</i>'}${T.items.map((x,ii)=>`<div class=card><span class=yr>${x.year}</span><b>${esc(x.title)}</b>${x.note?`<div class=note>📌 ${x.note}</div>`:''}<div>${row(S,ti,ii,x,'paper')}${row(S,ti,ii,x,'memo')}</div></div>`).join('')}</div>`).join('')}
function renderTT(){c.innerHTML=`<h2>🗓 Exam timetable</h2><div class=sub>Grade 10 · November 2026</div><div style="overflow-x:auto"><table style="border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0001;min-width:560px"><tr style="background:#1e3a8a;color:#fff;text-align:left"><th style="padding:10px">Date</th><th>Exam</th><th>Duration</th><th>Session</th></tr>`+
 M.exams.slice().sort((a,b)=>a.date<b.date?-1:1).map((x,i)=>`<tr style="background:${i%2?'#f8fafc':'#fff'}"><td style="padding:10px 12px"><b>${x.day}</b></td><td style="padding:0 12px">${x.paper}</td><td style="padding:0 12px">${x.duration}</td><td style="padding:0 12px;color:#6b7280">${x.session||'–'}</td></tr>`).join('')+
 `</table></div><div style="margin-top:18px">${M.examNotes.map(n=>`<div class=note style="margin:6px 0;max-width:640px;padding:8px 12px">📌 ${n}</div>`).join('')}</div>`}
function route(first){const r=parse();let key=r.s||'timetable';const S=subj(key);if(!S)key='timetable';
 if(key!==cur){cur=key;S?renderSubject(S):renderTT();
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k==key));
  const y=history.state&&history.state.y;
  if(y!=null)scrollTo(0,y);else if(r.sec&&document.getElementById('sec-'+r.sec))document.getElementById('sec-'+r.sec).scrollIntoView();else if(!first)scrollTo(0,0);}
 else if(history.state&&history.state.y!=null&&!r.v)scrollTo(0,history.state.y);
 if(r.v&&S){const[t,i,k]=r.v.split('.');const x=S.topics[+t]&&S.topics[+t].items[+i];x&&x[k]?openV(x.title+' – '+(k=='paper'?'paper':'memo'),x[k].local):closeUI()}else closeUI()}
function openV(t,p){vt.textContent=t;const img=/\.(png|jpe?g|gif|webp)$/i.test(p);vi.style.display=img?'block':'none';if(img){vi.src=u(p);vf.style.display='none'}else{vf.style.display='block';}if(img);else if(vf.dataset.p!==p){const n=document.createElement('iframe');n.id='vf';n.title='Viewer';n.src=u(p);n.dataset.p=p;vf.replaceWith(n)}vd.href=vo.href=u(p);vd.download=fname(p);v.style.display='flex';document.body.style.overflow='hidden'}
function closeUI(){if(v.style.display!='none'){v.style.display='none';vf.replaceWith(Object.assign(document.createElement('iframe'),{id:'vf',title:'Viewer'}));document.body.style.overflow=''}}
function closeV(){if(history.state&&history.state.viewer)history.back();else{const r=parse();r.v='';history.replaceState({y:scrollY},'',link(r));route()}}
c.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();history.replaceState(Object.assign({},history.state,{y:scrollY}),'',location.hash||'#');history.pushState({viewer:1,y:scrollY},'',a.getAttribute('href'));route()});
s.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();history.replaceState(Object.assign({},history.state,{y:scrollY}),'',location.hash||'#');history.pushState({y:0},'',a.getAttribute('href'));route()});
addEventListener('popstate',()=>route());addEventListener('keydown',e=>{if(e.key=='Escape'&&v.style.display=='flex')closeV()});
let tm;addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{if(v.style.display=='flex')return;const r=parse();let sec='';document.querySelectorAll('main h3').forEach(h=>{if(h.getBoundingClientRect().top<120)sec=h.id.slice(4)});if(cur!=='timetable')r.sec=sec;history.replaceState(Object.assign({},history.state,{y:scrollY}),'',link(r))},150)},{passive:true});
s.innerHTML=`<a data-k=timetable href="#s=timetable">🗓 Exam timetable</a>`+M.subjects.map(S=>`<a data-k="${slug(S.name)}" href="#s=${slug(S.name)}">${esc(S.name)}</a>`).join('');
{const q=new URLSearchParams(location.search);if(!location.hash&&q.get('view')=='timetable')history.replaceState(null,'','#s=timetable');else if(!location.hash&&q.get('s'))history.replaceState(null,'','#s='+slug(M.subjects[+q.get('s')].name));}
route(true);
</script></body></html>
