<!doctype html><html><head><meta charset=utf-8><title>Schoolie – Exam Prep</title><style>
body{margin:0;font-family:system-ui,sans-serif;display:flex;height:100vh;background:#f4f6fb;color:#1f2937}
nav{width:230px;background:#1e3a8a;color:#fff;padding:20px}nav h1{font-size:20px}nav a{display:block;padding:8px 10px;border-radius:8px;color:#dbeafe;cursor:pointer;text-decoration:none}nav a.on{background:#3b82f6;color:#fff}
main{flex:1;overflow:auto;padding:24px 32px}h2{margin:0}.sub{color:#6b7280;margin-bottom:16px}h3{border-bottom:2px solid #c7d2fe;padding-bottom:4px;margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0001}
.yr{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}.card b{display:block;margin:8px 0}
.btns a{display:inline-block;font-size:13px;margin:3px 4px 0 0;padding:5px 9px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer}.btns a.m{background:#059669}.btns a.d{background:#e5e7eb;color:#111}
#v{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}#v div{background:#fff;width:90vw;height:90vh;border-radius:10px;display:flex;flex-direction:column}#v iframe{flex:1;border:0}#v p{margin:8px 12px;display:flex;justify-content:space-between}
</style></head><body><nav><h1>📚 Schoolie</h1><div id=s></div></nav><main id=c></main><div id=v><div><p><span id=vt></span><a href=# onclick="v.style.display='none'">✕ Close</a></p><iframe id=vf></iframe></div></div><script src="manifest.js"></script>
<script>
let M;const src=(f,dl)=>f.local?encodeURI(f.local):f.url?(dl?f.url.replace(/\/edit.*$/,'/export?format=pdf'):f.url.replace(/\/edit.*$/,'/preview')):dl?`https://drive.google.com/uc?export=download&id=${f.drive}`:`https://drive.google.com/file/d/${f.drive}/preview`;
function view(t,u){vt.textContent=t;vf.src=u;v.style.display='flex'}
function tt(){document.querySelectorAll('nav a').forEach(a=>a.className=a.id=='tta'?'on':'');
c.innerHTML=`<h2>🗓 Exam timetable</h2><div class=sub>Grade 10 · November 2026</div><table style="border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0001;min-width:640px">
<tr style="background:#1e3a8a;color:#fff;text-align:left"><th style="padding:10px">Date</th><th>Exam</th><th>Duration</th><th>Session</th></tr>`+
M.exams.slice().sort((a,b)=>a.date<b.date?-1:1).map((x,i)=>`<tr style="background:${i%2?'#f8fafc':'#fff'}"><td style="padding:10px 12px"><b>${x.day}</b></td><td style="padding:0 12px">${x.paper}</td><td style="padding:0 12px">${x.duration}</td><td style="padding:0 12px;color:#6b7280">${x.session||'–'}</td></tr>`).join('')+
`</table><div style="margin-top:18px">${M.examNotes.map(n=>`<div style="background:#fef3c7;padding:8px 12px;border-radius:8px;margin:6px 0;max-width:640px">📌 ${n}</div>`).join('')}</div>`}
function show(i){const S=M.subjects[i];document.querySelectorAll('nav a.sj').forEach((a,j)=>a.className='sj'+(j==i?' on':''));document.getElementById('tta').className='';
c.innerHTML=`<h2>${S.name}</h2><div class=sub>${S.class} · ${S.teacher}</div>`+S.topics.map(T=>`<h3>${T.name}</h3><div class=grid>${T.items.length?'':'<i style="color:#888">Not available yet</i>'}${T.items.map(x=>`<div class=card><span class=yr>${x.year}</span><b>${x.title}</b>${x.note?`<div style="background:#fef3c7;padding:6px 8px;border-radius:6px">📌 ${x.note}</div>`:''}<div class=btns>
${x.paper?`<a onclick="view('${x.title} – paper','${src(x.paper)}')">View paper</a><a class=d href="${src(x.paper,1)}" download>⬇ Paper</a>`:''}
${x.memo?`<a class=m onclick="view('${x.title} – memo','${src(x.memo)}')">View memo</a><a class=d href="${src(x.memo,1)}" download>⬇ Memo</a>`:(x.note?'':'<i style="font-size:12px;color:#888">no memo</i>')}</div></div>`).join('')}</div>`).join('')}
Promise.resolve(window.MANIFEST).then(m=>{M=m;s.innerHTML=`<a id=tta onclick=tt()>🗓 Exam timetable</a>`+m.subjects.map((S,i)=>`<a class=sj onclick=show(${i})>${S.name}</a>`).join('');const q=new URLSearchParams(location.search);q.get('view')=='timetable'?tt():show(+(q.get('s')||0));const h=decodeURIComponent(location.hash.slice(1));if(h){const [t,i,k]=h.split('|');const x=M.subjects[0].topics[t].items[i];view(x.title+' – '+k,src(x[k]))}})
</script></body></html>
